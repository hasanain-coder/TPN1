<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TPN Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--pri:#115E59;--pri-l:#F0FDFA;--acc:#0F766E;--bg:#F1F5F9;--card:#fff;--tx:#0F172A;--mut:#64748B;--brd:#E2E8F0;--warn:#D97706;--warn-bg:#FFFBEB;--err:#DC2626;--err-bg:#FEF2F2;--pharm:#F0FDF4;--pharm-b:#A7F3D0}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
.fd{font-family:'Space Grotesk',sans-serif}
.inp{width:100%;padding:5px 8px;border:1.5px solid var(--brd);border-radius:6px;font-size:13px;font-family:inherit;color:var(--tx);background:#fff;transition:border-color .15s,box-shadow .15s;-moz-appearance:textfield}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2.5px rgba(15,118,110,.1)}
.inp::-webkit-outer-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none}
select.inp{cursor:pointer;padding-right:6px}
.unit{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;color:#94A3B8;pointer-events:none;font-weight:500}
.lbl{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-bottom:2px;line-height:1.2}
.card{background:var(--card);border-radius:10px;border:1px solid var(--brd);box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:8px;overflow:hidden}
.card-hdr{display:flex;align-items:center;padding:10px 12px;cursor:pointer;gap:8px;min-height:42px;user-select:none;-webkit-tap-highlight-color:transparent}
.card-hdr:active{background:#F8FAFC}
.card-body{padding:0 12px 12px}
.chev{font-size:10px;color:#94A3B8;transition:transform .2s;flex-shrink:0;width:14px;text-align:center}
.chev.open{transform:rotate(90deg)}
.pname{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptag{font-size:11px;color:var(--mut);flex-shrink:0}
.ptag-v{font-size:11px;font-weight:700;color:var(--acc);flex-shrink:0}
.rmbtn{width:26px;height:26px;border:none;background:transparent;color:#CBD5E1;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:12px;transition:all .15s}
.rmbtn:hover{background:#FEE2E2;color:#EF4444}
.rm-confirm{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--err-bg);border-top:1px solid #FECACA;font-size:11px;color:#991B1B}
.rm-confirm button{border:none;border-radius:4px;padding:2px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.rm-confirm .yes{background:#DC2626;color:#fff}
.rm-confirm .no{background:#fff;color:#64748B;border:1px solid #E2E8F0}
.addon-row{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.addon-row select{flex:1;min-width:0}
.addon-row .inp{width:52px;flex-shrink:0;text-align:center;padding:5px 4px}
.addon-row .aunit{font-size:10px;color:#94A3B8;flex-shrink:0}
.addon-rm{width:22px;height:22px;border:none;background:transparent;color:#CBD5E1;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;flex-shrink:0}
.addon-rm:hover{background:#FEE2E2;color:#EF4444}
.add-btn{border:none;background:transparent;color:var(--acc);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;padding:2px 0;display:flex;align-items:center;gap:3px}
.add-btn:hover{text-decoration:underline}
.sec-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94A3B8;margin:8px 0 4px;padding-bottom:3px;border-bottom:1px solid #F1F5F9}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.sr{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
.sl{font-size:11px;color:var(--mut)}
.sv{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--tx)}
.su{font-size:9px;color:#94A3B8;margin-left:2px;font-weight:400}
.elec-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0}
.elec-c{text-align:center;padding:4px 2px;border-radius:6px;background:#F8FAFC;border:1px solid #F1F5F9}
.elec-c .el{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px}
.elec-c .ev{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;line-height:1.2}
.elec-c .eu{font-size:9px;color:var(--mut)}
.pr{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #D1FAE5;font-size:12px}
.pr:last-child{border-bottom:none}
.pr-l{color:#065F46;font-size:11px}
.pr-v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--tx)}
.pr-t{font-weight:800;border-top:2px solid #A7F3D0;border-bottom:none;margin-top:2px;padding-top:4px}
.split-box{background:#F0FDFA;border:2px solid #5EEAD4;border-radius:8px;padding:8px;margin-top:6px}
.split-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#0F766E;margin-bottom:6px}
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.split-bag{background:#fff;border:1px solid #99F6E4;border-radius:6px;padding:6px}
.split-bag-t{font-size:10px;font-weight:700;color:#0D9488;text-align:center;margin-bottom:4px}
.split-row{display:flex;justify-content:space-between;font-size:10px;padding:1px 0;color:#374151}
.split-row .fd{font-weight:600}
.split-tot{display:flex;justify-content:space-between;font-size:10px;font-weight:700;padding-top:3px;margin-top:2px;border-top:1px solid #99F6E4;color:#0F766E}
.wmsg{background:var(--warn-bg);border:1px solid #FDE68A;border-left:3px solid var(--warn);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:11px;color:#92400E;display:flex;align-items:flex-start;gap:6px;line-height:1.4}
.emsg{background:var(--err-bg);border:1px solid #FECACA;border-left:3px solid var(--err);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:11px;color:#991B1B;display:flex;align-items:flex-start;gap:6px;line-height:1.4}
.empty-st{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:#94A3B8;text-align:center}
.empty-st i{font-size:32px;margin-bottom:12px;color:#CBD5E1}
.loss-sel{display:flex;border:1px solid var(--brd);border-radius:6px;overflow:hidden;align-self:stretch}
.loss-sel button{border:none;padding:4px 0;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;flex:1;background:#fff;color:#64748B}
.loss-sel button.on{background:var(--pri);color:#fff}
.gact{border:none;padding:5px 10px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:4px}
.label-chk{width:16px;height:16px;accent-color:var(--acc);cursor:pointer;flex-shrink:0;border-radius:3px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fi .25s ease-out}
@media print{
.no-print{display:none!important}
#print-view{display:block!important}
body{background:#fff}
@page{size:landscape;margin:10mm}
.pt{width:100%;border-collapse:collapse;font-size:9px;font-family:'Plus Jakarta Sans',sans-serif}
.pt th,.pt td{border:1px solid #bbb;padding:3px 5px;text-align:center}
.pt th:first-child,.pt td:first-child{position:sticky;left:0;background:#fff;z-index:2;text-align:left;font-weight:600;min-width:120px;max-width:150px}
.pt thead th{background:#E2E8F0;font-weight:700;font-size:8px;text-transform:uppercase;letter-spacing:.04em;vertical-align:bottom}
.pt thead th:first-child{background:#fff}
.pt .gr td{background:#F1F5F9;font-weight:700;font-size:8px;text-transform:uppercase;letter-spacing:.04em;text-align:left}
.pt .tr td{font-weight:700;background:#F8FAFC}
.pt .err-cell{color:#DC2626;font-style:italic;font-weight:400;font-size:8px}
.ph{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;margin-bottom:4px}
.ps{font-size:10px;color:#64748B;margin-bottom:12px}
}
</style>
</head>
<body>

<header class="no-print" style="background:#fff;border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:20">
<div style="max-width:540px;margin:0 auto;padding:8px 12px">
<div style="display:flex;align-items:center;gap:6px">
<div style="width:28px;height:28px;border-radius:7px;background:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas fa-syringe" style="color:#fff;font-size:11px"></i></div>
<span class="fd" style="font-weight:700;font-size:15px">TPN</span>
<input type="date" id="g-date" class="inp" style="width:110px;padding:4px 6px;font-size:11px">
<select id="g-brand" class="inp" style="flex:1;padding:4px 6px;font-size:11px;min-width:0">
<option value="Smofkabevin">Smofkabiven</option>
<option value="Kabevin">Kabiven</option>
<option value="Periolimel">Periolimel</option>
</select>
<div style="flex:1"></div>
<button class="gact" style="background:var(--pri);color:#fff" id="btn-add"><i class="fas fa-plus"></i> Patient</button>
<button class="gact" style="background:#475569;color:#fff" id="btn-labels"><i class="fas fa-tag"></i> Labels</button>
<button class="gact" style="background:#334155;color:#fff" id="btn-print"><i class="fas fa-print"></i> Print</button>
</div>
</div>
</header>

<main class="no-print" style="max-width:540px;margin:0 auto;padding:8px 12px 40px">
<div id="pc"></div>
<div id="empty-st" class="empty-st" style="display:none">
<i class="fas fa-user-plus"></i>
<div style="font-size:13px;font-weight:600;margin-bottom:4px;color:#64748B">No patients yet</div>
<div style="font-size:11px">Tap "Patient" above to add one</div>
</div>
</main>

<div id="print-view" style="display:none"></div>

<script>
var B={
Smofkabevin:{l:'Smofkabiven',g:13,a:10,li:20,na:.079,k:.06,cl:.07,ca:.005},
Kabevin:{l:'Kabiven',g:11,a:11.3,li:20,na:.1,k:.08,cl:.156,ca:.006},
Periolimel:{l:'Periolimel',g:18.75,a:6.3,li:15,na:.0525,k:.04,cl:.0617,ca:.005}
};
var AT={
na3:{l:'Na 3%',na:.513,k:0},
na09:{l:'Na 0.9%',na:.154,k:0},
k:{l:'K',na:0,k:2},
other:{l:'Other',na:0,k:0}
};

var S={date:new Date().toISOString().split('T')[0],brand:'Smofkabevin',pts:[],nid:1};

function f(v,d){return(v==null||isNaN(v))?'—':Number(v).toFixed(d)}
function gp(id){return S.pts.find(function(p){return p.id===id})}
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function escH(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function nn(v){var n=parseFloat(v);return(isNaN(n)||n<0)?0:n}

function calc(p){
var b=B[S.brand],el=p.loss;
var aoV=p.ao.reduce(function(s,a){return s+(parseFloat(a.v)||0)},0);
var tv=(p.fi*p.w)-p.tv-aoV;
var errs=[];
if(!p.w||p.w<=0)errs.push('Weight must be a positive number.');
if(!p.fi||p.fi<=0)errs.push('Fluid input must be a positive number.');
if(tv<=0&&p.w>0&&p.fi>0)errs.push('TPN target volume is zero or negative. Increase fluid input or decrease treatment/add-on volumes.');
if(errs.length)return{errs:errs,tv:0};

var lv=(p.ld*p.w*100)/b.li;
var av=(p.ad*p.w*100)/b.a;
var gv=tv-lv-av;
if(gv<=0)return{errs:['Lipid + Amino Acid volumes ('+f(lv+av,1)+' ml) exceed TPN target ('+f(tv,1)+' ml).'],tv:tv};

var gg=p.gir*1440*p.w/1000;
var tgp=(gg/gv)*100;

var vb=0,v5=0,v50=0;
if(tgp>=b.g&&tgp<=50){vb=Math.abs(tgp-50)/(50-b.g)*gv;v50=Math.abs(tgp-b.g)/(50-b.g)*gv}
else if(tgp>=5&&tgp<b.g){v5=Math.abs(tgp-50)/45*gv;v50=Math.abs(tgp-5)/45*gv}
else if(tgp<5){v5=gv}
else{v50=gv}

var actualGG=(vb*b.g+v5*5+v50*50)/100;

var Na=b.na*av,K=b.k*av,Cl=b.cl*av,Ca=b.ca*av;
var aNa=0,aK=0;
p.ao.forEach(function(a){var vol=parseFloat(a.v)||0;var t=AT[a.t];if(t){aNa+=t.na*vol;aK+=t.k*vol}});
Na+=aNa;K+=aK;

var agir=actualGG*1000/(1440*p.w);
var gpt=(actualGG*100)/tv;
var ce=actualGG*3.4;
var le=p.ld*p.w*9;
var en=(le+(p.ad*p.w*4)+ce)/p.w;
var lcr=(ce+le)>0?(le/(ce+le))*100:0;
var ap=(p.ad*p.w)/tv*100;
var ng=(p.ad*p.w)/6.25;
var npc=ng>0?(le+ce)/ng:0;
var osm=((p.ad*p.w*10)+(actualGG*5)+((Na+K)*2)+(Ca*2*1.4))/(tv/1000);

var lm=1+(el/tv);
var rawTot=(lv+av+vb+v5+v50)*lm;
var aoRaw=p.ao.reduce(function(s,a){return s+(parseFloat(a.v)||0)*lm},0);
rawTot+=aoRaw;
var targetTot=Math.round(rawTot);

var pl=Math.round(lv*lm);
var pa=Math.round(av*lm);
var pb=Math.round(vb*lm);
var p5=Math.round(v5*lm);
var p50=Math.round(v50*lm);
var pao=p.ao.map(function(a){return{t:a.t,v:Math.round((parseFloat(a.v)||0)*lm)}});
var paot=pao.reduce(function(s,a){return s+a.v},0);
var ptot=pl+pa+pb+p5+p50+paot;
var diff=targetTot-ptot;
if(diff!==0){
var cands=[{k:'pb',ref:function(v){pb=v}},{k:'p5',ref:function(v){p5=v}},{k:'p50',ref:function(v){p50=v}},{k:'pl',ref:function(v){pl=v}},{k:'pa',ref:function(v){pa=v}}];
var vals={pb:pb,p5:p5,p50:p50,pl:pl,pa:pa};
var best=null,bestV=-1;
for(var ci=0;ci<cands.length;ci++){if(vals[cands[ci].k]>bestV){bestV=vals[cands[ci].k];best=cands[ci]}}
if(best){best.ref(bestV+diff);ptot=targetTot}
}

var split=tv>151&&tv<302;

/* Per-bag totals for label generation */
var b1t=0,b2t=0,b1ao=[],b2ao=[];
if(split){
var sv2=function(v){var a=Math.floor(v/2);return[a,v-a]};
var _b1l=sv2(pl),_b1a=sv2(pa),_b1b=sv2(pb),_b15=sv2(p5),_b150=sv2(p50);
b1ao=pao.map(function(a){return sv2(a.v)});
b2ao=pao.map(function(a){return[a[1],a[0]]});
b1t=_b1l[0]+_b1a[0]+_b1b[0]+_b15[0]+_b150[0]+b1ao.reduce(function(s,a){return s+a[0]},0);
b2t=_b1l[1]+_b1a[1]+_b1b[1]+_b15[1]+_b150[1]+b1ao.reduce(function(s,a){return s+a[1]},0);
}

var w=[];
if(tgp<5)w.push('This is the lowest GIR you can obtain. Actual GIR is higher than target.');
if(tgp>50)w.push('Try increasing TPN volume. This is the highest GIR you can obtain. Actual GIR is lower than target.');
if(gpt>12)w.push('Consider using central line OR lower the concentration by lowering the GIR or increasing total volume.');
var fmk=p.tf/p.w;
if(fmk>=100)w.push('PN can be discontinued when enteral feeds reach 100 to 120 mL/kg/d.');
if(fmk>60&&fmk<=99)w.push('Condensing PN to 80 to 90 mL/kg/d when enteral feeds reach 60 mL/kg/d helps maintain appropriate caloric intake. This can be accomplished by decreasing lipids to 1 g/kg/d, continuing full goal protein, and leaving dextrose concentrations the same.');

return{tv:tv,lv:lv,av:av,gv:gv,gg:gg,tgp:tgp,vb:vb,v5:v5,v50:v50,actualGG:actualGG,Na:Na,K:K,Cl:Cl,Ca:Ca,aNa:aNa,aK:aK,agir:agir,gpt:gpt,en:en,lcr:lcr,ap:ap,npc:npc,osm:osm,pl:pl,pa:pa,pb:pb,p5:p5,p50:p50,pao:pao,paot:paot,ptot:ptot,lm:lm,split:split,b1t:b1t,b2t:b2t,b1ao:b1ao,b2ao:b2ao,w:w,fmk:fmk,errs:[]};
}

function renderAll(){
var c=$('#pc'),e=$('#empty-st');
if(!S.pts.length){c.innerHTML='';e.style.display='flex';return}
e.style.display='none';
c.innerHTML=S.pts.map(renderCard).join('');
}

function renderCard(p){
var r=p.r;
var hasErr=r&&r.errs&&r.errs.length;
var hasWarn=r&&!r.errs.length&&r.w&&r.w.length;
var tvDisp=hasErr?'—':(r?Math.round(r.tv)+' ml':'— ml');
var wDisp=p.w?f(p.w,1):'—';
return'<div class="card patient-card anim" data-id="'+p.id+'">'+
'<div class="card-hdr" data-act="toggle">'+
'<input type="checkbox" class="label-chk" data-id="'+p.id+'"'+(p.lbl!==false?' checked':'')+' title="Include in label PDF">'+
'<i class="fas fa-chevron-right chev'+(p.col?'':' open')+'"></i>'+
'<span class="pname">'+escH(p.n||'Patient '+p.id)+'</span>'+
'<span class="ptag">'+wDisp+' kg</span>'+
'<span class="ptag-v">'+tvDisp+'</span>'+
(hasWarn?'<i class="fas fa-exclamation-triangle" style="color:#D97706;font-size:11px;flex-shrink:0"></i>':'')+
(hasErr?'<i class="fas fa-times-circle" style="color:#DC2626;font-size:11px;flex-shrink:0"></i>':'')+
'<button class="rmbtn" data-act="rm"><i class="fas fa-times"></i></button>'+
'</div>'+
'<div class="rm-confirm" style="display:'+(p.rc?'flex':'none')+'" data-id="'+p.id+'">'+
'<span style="flex:1">Remove this patient?</span>'+
'<button class="yes" data-act="rm-y">Yes</button>'+
'<button class="no" data-act="rm-n">No</button>'+
'</div>'+
'<div class="card-body" style="display:'+(p.col?'none':'block')+'">'+
'<div style="margin-bottom:5px"><label class="lbl">Patient Name</label><input class="inp" type="text" data-f="n" value="'+escH(p.n)+'" autocomplete="off"></div>'+
'<div class="sg">'+
'<div><label class="lbl">Weight</label><div class="relative"><input type="number" inputmode="decimal" class="inp" data-f="w" value="'+(p.w||'')+'" step="0.1" min="0"><span class="unit">kg</span></div></div>'+
'<div><label class="lbl">Fluid Input</label><div class="relative"><input type="number" inputmode="numeric" class="inp" data-f="fi" value="'+(p.fi||'')+'" step="1" min="0"><span class="unit">ml/kg</span></div></div>'+
'<div><label class="lbl">Treatment Vol</label><div class="relative"><input type="number" inputmode="numeric" class="inp" data-f="tv" value="'+(p.tv||'')+'" step="1" min="0"><span class="unit">ml</span></div></div>'+
'<div><label class="lbl">Target GIR</label><div class="relative"><input type="number" inputmode="decimal" class="inp" data-f="gir" value="'+(p.gir||'')+'" step="0.1" min="0"><span class="unit">mg/kg/min</span></div></div>'+
'<div><label class="lbl">Lipid Dose</label><div class="relative"><input type="number" inputmode="decimal" class="inp" data-f="ld" value="'+(p.ld||'')+'" step="0.1" min="0"><span class="unit">g/kg</span></div></div>'+
'<div><label class="lbl">AA Dose</label><div class="relative"><input type="number" inputmode="decimal" class="inp" data-f="ad" value="'+(p.ad||'')+'" step="0.1" min="0"><span class="unit">g/kg</span></div></div>'+
'</div>'+
'<div style="display:flex;gap:8px;align-items:end">'+
'<div style="flex:1"><label class="lbl">Enteral Feeding</label><div class="relative"><input type="number" inputmode="numeric" class="inp" data-f="tf" value="'+(p.tf||'')+'" step="1" min="0"><span class="unit">ml</span></div></div>'+
'<div style="flex:1"><label class="lbl">Exp. Loss</label><div class="loss-sel" data-id="'+p.id+'"><button data-lv="10"'+(p.loss===10?' class="on"':'')+'>10 ml</button><button data-lv="20"'+(p.loss===20?' class="on"':'')+'>20 ml</button></div></div>'+
'</div>'+
'<div style="margin-top:8px">'+
'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">'+

function renderRes(p){
var r=p.r;
if(!r)return'';
if(r.errs.length)return r.errs.map(function(e){return'<div class="emsg"><i class="fas fa-triangle-exclamation" style="margin-top:2px;flex-shrink:0"></i><span>'+e+'</span></div>'}).join('');
var b=B[S.brand];
var h='<div class="sec-t">Clinical Summary</div>';
h+='<div class="sg">';
h+=sr('Actual GIR',f(r.agir,2),'mg/kg/min');
h+=sr('Glucose %',f(r.gpt,2),'%');
h+=sr('Energy',f(r.en,1),'kcal/kg');
h+=sr('Lipid:Carb',f(r.lcr,1),'%');
h+=sr('AA %',f(r.ap,2),'%');
h+=sr('NPC:N',f(r.npc,1),'kcal:N');
h+=sr('Osmolarity',f(r.osm,0),'mOsm/L');
h+='</div>';
h+='<div class="sec-t">Electrolytes</div>';
h+='<div class="elec-row">';
h+=ec('Na',r.Na,'#0F766E');
h+=ec('K',r.K,'#7C3AED');
h+=ec('Cl',r.Cl,'#0284C7');
h+=ec('Ca',r.Ca,'#D97706');
h+='</div>';
h+='<div class="sec-t">Pharmacy Preparation</div>';
h+='<div style="background:var(--pharm);border:1px solid var(--pharm-b);border-radius:8px;padding:8px">';
h+=pr('Lipid ('+b.l+' '+b.li+'%)',r.pl);
h+=pr('Amino Acid ('+b.l+' '+b.a+'%)',r.pa);
if(r.pb>0)h+=pr('Glucose ('+b.l+' '+b.g+'%)',r.pb);
if(r.p5>0)h+=pr('Glucose (D5W 5%)',r.p5);
if(r.p50>0)h+=pr('Glucose (D50W 50%)',r.p50);
r.pao.forEach(function(a){if(a.v>0)h+=pr('Add-on: '+AT[a.t].l,a.v)});
h+='<div class="pr pr-t"><span class="pr-l">Total</span><span class="pr-v">'+r.ptot+' ml</span></div>';
h+='</div>';
if(r.split){
var sv2=function(v){var a=Math.floor(v/2);return[a,v-a]};
var b1l=sv2(r.pl),b1a=sv2(r.pa),b1b=sv2(r.pb),b15=sv2(r.p5),b150=sv2(r.p50);
var b1ao=r.pao.map(function(a){return sv2(a.v)});
var b1t=b1l[0]+b1a[0]+b1b[0]+b15[0]+b150[0]+b1ao.reduce(function(s,a){return s+a[0]},0);
var b2t=b1l[1]+b1a[1]+b1b[1]+b15[1]+b150[1]+b1ao.reduce(function(s,a){return s+a[1]},0);
h+='<div class="split-box"><div class="split-title"><i class="fas fa-layer-group"></i> Prepare as 2 Bags</div><div class="split-grid">';
h+='<div class="split-bag"><div class="split-bag-t">Bag 1</div>';
h+=spr('Lipid',b1l[0]);h+=spr('AA',b1a[0]);
if(b1b[0]>0)h+=spr('Glu ('+b.g+'%)',b1b[0]);
if(b15[0]>0)h+=spr('Glu (5%)',b15[0]);
if(b150[0]>0)h+=spr('Glu (50%)',b150[0]);
r.pao.forEach(function(a,i){if(b1ao[i][0]>0)h+=spr(AT[a.t].l,b1ao[i][0])});
h+='<div class="split-tot"><span>Total</span><span>'+b1t+' ml</span></div></div>';
h+='<div class="split-bag"><div class="split-bag-t">Bag 2</div>';
h+=spr('Lipid',b1l[1]);h+=spr('AA',b1a[1]);
if(b1b[1]>0)h+=spr('Glu ('+b.g+'%)',b1b[1]);
if(b15[1]>0)h+=spr('Glu (5%)',b15[1]);
if(b150[1]>0)h+=spr('Glu (50%)',b150[1]);
r.pao.forEach(function(a,i){if(b1ao[i][1]>0)h+=spr(AT[a.t].l,b1ao[i][1])});
h+='<div class="split-tot"><span>Total</span><span>'+b2t+' ml</span></div></div>';
h+='</div></div>'}
if(r.w.length)h+=r.w.map(function(w){return'<div class="wmsg"><i class="fas fa-exclamation-circle" style="margin-top:2px;flex-shrink:0"></i><span>'+w+'</span></div>'}).join('');
return h;
}

function sr(l,v,u){return'<div class="sr"><span class="sl">'+l+'</span><span><span class="sv">'+v+'</span><span class="su">'+u+'</span></span></div>'}
function ec(l,v,c){return'<div class="elec-c"><div class="el" style="color:'+c+'">'+l+'</div><div class="ev" style="color:'+c+'">'+f(v,2)+'</div><div class="eu">mmol</div></div>'}
function pr(l,v){return'<div class="pr"><span class="pr-l">'+l+'</span><span class="pr-v">'+v+' ml</span></div>'}
function spr(l,v){return'<div class="split-row"><span>'+l+'</span><span class="fd">'+v+' ml</span></div>'}

function updRes(id){
var p=gp(id);if(!p)return;
var el=$('#res-'+id);
if(el)el.innerHTML=renderRes(p);
updHdr(id);
}

function updHdr(id){
var p=gp(id);if(!p)return;
var card=$('.patient-card[data-id="'+id+'"]');
if(!card)return;
var r=p.r;
var hasErr=r&&r.errs&&r.errs.length;
var hasWarn=r&&!r.errs.length&&r.w&&r.w.length;
card.querySelector('.pname').textContent=p.n||'Patient '+p.id;
card.querySelector('.ptag').textContent=(p.w?f(p.w,1):'—')+' kg';
card.querySelector('.ptag-v').textContent=hasErr?'—':(r?Math.round(r.tv)+' ml':'— ml');
var hdr=card.querySelector('.card-hdr');
var icons=hdr.querySelectorAll('i.fa-exclamation-triangle,i.fa-times-circle');
for(var i=0;i<icons.length;i++)icons[i].remove();
if(hasWarn){var ic=document.createElement('i');ic.className='fas fa-exclamation-triangle';ic.style.cssText='color:#D97706;font-size:11px;flex-shrink:0';hdr.querySelector('.rmbtn').before(ic)}
if(hasErr){var ic2=document.createElement('i');ic2.className='fas fa-times-circle';ic2.style.cssText='color:#DC2626;font-size:11px;flex-shrink:0';hdr.querySelector('.rmbtn').before(ic2)}
}

function readInp(id){
var p=gp(id);if(!p)return;
var card=$('.patient-card[data-id="'+id+'"]');
if(!card)return;
var fields=card.querySelectorAll('[data-f]');
for(var i=0;i<fields.length;i++){
var el=fields[i],fd=el.dataset.f;
p[fd]=fd==='n'?el.value:nn(el.value);
}
var rows=card.querySelectorAll('.addon-row');
for(var j=0;j<rows.length;j++){
var idx=parseInt(rows[j].dataset.idx);
var ts=rows[j].querySelector('.addon-type');
var vs=rows[j].querySelector('.addon-vol');
if(p.ao[idx]){p.ao[idx].t=ts.value;p.ao[idx].v=nn(vs.value)}
}
}

function addPt(){
S.pts.push({id:S.nid++,n:'',w:0,fi:0,tv:0,gir:0,ld:0,ad:0,tf:0,loss:10,ao:[],col:false,rc:false,lbl:true,r:null});
renderAll();

function recalc(id){

p.r=calc(p);updRes(id);
}

function printAll(){

var valid=S.pts.filter(function(p){return p.r&&!p.r.errs.length});
if(!valid.length){alert('No patients with valid calculations to print.');return}

h+=prow('Lipid Dose (g/kg)',pts,function(p){return f(p.ld,1)});
h+=prow('AA Dose (g/kg)',pts,function(p){return f(p.ad,1)});
h+=prow('Enteral Feeding (ml)',pts,function(p){return Math.round(p.tf)});
h+=prow('Expected Loss (ml)',pts,function(p){return p.loss});
h+='<tr class="gr"><td colspan="'+(pts.length+1)+'">Preparation Volumes</td></tr>';

h+=prow('Amino Acid (ml)',pts,function(p){return p.r.pa});
h+=prow('Glucose — '+b.l+' '+b.g+'% (ml)',pts,function(p){return p.r.pb});
h+=prow('Glucose — D5W 5% (ml)',pts,function(p){return p.r.p5});
h+=prow('Glucose — D50W 50% (ml)',pts,function(p){return p.r.p50});
aoList.forEach(function(t){
h+=prow('Add-on: '+AT[t].l+' (ml)',pts,function(p){
var total=p.r.pao.filter(function(a){return a.t===t}).reduce(function(s,a){return s+a.v},0);
return total>0?total:'—'});
});
h+=prow('Total Prep Vol (ml)',pts,function(p){return p.r.ptot},true);
h+=prow('Bags',pts,function(p){return p.r.split?'2':'1'});
h+='<tr class="gr"><td colspan="'+(pts.length+1)+'">Electrolytes (mmol)</td></tr>';

h+=prow('Ca',pts,function(p){return f(p.r.Ca,2)});
h+='<tr class="gr"><td colspan="'+(pts.length+1)+'">Clinical</td></tr>';

h+=prow('NPC:N Ratio',pts,function(p){return f(p.r.npc,1)});

h+='</tbody></table>';
 $('#print-view').innerHTML=h;window.print();
}

function prow(label,pts,fn,bold){
var h='<tr'+(bold?' class="tr"':'')+'><td>'+label+'</td>';

if(!p.r||p.r.errs.length){h+='<td class="err-cell">Error</td>'}
else{h+='<td>'+fn(p)+'</td>'}
});
h+='</tr>';return h;
}

function generateLabels(){
if(typeof html2pdf==='undefined'){alert('PDF library not loaded. Please check your internet connection and refresh.');return}

var selected=S.pts.filter(function(p){return p.lbl!==false&&p.r&&!p.r.errs.length&&p.r.ptot>0});
if(!selected.length){alert('No checked patients with valid calculations.\n\nCheck the box next to each patient to include them in the labels.');return}

var now=new Date();
var timeStr=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

var container=document.createElement('div');
container.style.cssText='position:fixed;left:-9999px;top:0;z-index:-1;';

selected.forEach(function(p){
var r=p.r;
var numBags=r.split?2:1;
var bagVols, bagAddons, bagNamesAr, bagNamesEn, durations;

if(numBags===2){
bagVols=[r.b1t,r.b2t];
bagNamesAr=['\u0643\u064A\u0633 \u0661 \u0645\u0646 \u0662','\u0643\u064A\u0633 \u0662 \u0645\u0646 \u0662'];
bagNamesEn=['Bag 1 of 2','Bag 2 of 2'];
durations=[12,12];
bagAddons=[[],[]];
r.b1ao.forEach(function(ba,i){
if(ba[0]>0)bagAddons[0].push({t:r.pao[i].t,v:ba[0]});
if(ba[1]>0)bagAddons[1].push({t:r.pao[i].t,v:ba[1]});
});
}else{
bagVols=[r.ptot];
bagNamesAr=[''];
bagNamesEn=[''];
durations=[24];
bagAddons=[r.pao.filter(function(a){return a.v>0})];
}

var routeAr=r.osm>900?'\u0645\u0631\u0643\u0632\u064A':'\u0645\u062D\u064A\u0637\u064A';
var routeEn=r.osm>900?'Central':'Peripheral';

for(var i=0;i<numBags;i++){
var rate=(bagVols[i]/durations[i]).toFixed(1);
var instr='\u064A\u064F\u0633\u0631\u0628 \u0639\u0628\u0631 \u0645\u0636\u062E\u0629 \u062A\u0633\u0631\u064A\u0628 \u0628\u0645\u0639\u062F\u0644 '+rate+' \u0645\u0644/\u0633\u0627\u0639\u0629';
if(numBags===2){
instr+='\u0020\u2014\u0020'+bagNamesAr[i]+('\u0020\u2014\u0020'+durations[i]+' \u0633\u0627\u0639\u0629');
}else{
instr+='\u0020\u0644\u0645\u062F\u0629 24 \u0633\u0627\u0639\u0629';
}

var addParts=[];
bagAddons[i].forEach(function(a){addParts.push(AT[a.t].l+': '+a.v+' ml')});
var additives=addParts.length?addParts.join(', '):'\u2014';

var subtitle=bagNamesAr[i]?('<div style="font-size:2.8mm;font-weight:600;margin-top:0.3mm;">'+bagNamesAr[i]+'</div>'):'';

var page=document.createElement('div');
page.style.cssText='width:210mm;height:297mm;display:flex;align-items:center;justify-content:center;page-break-after:always;background:#fff;';

page.innerHTML=
'<div style="width:60mm;border:1px solid #000;padding:2mm;font-family:Arial,Helvetica,sans-serif;direction:rtl;">'+
'<div style="text-align:center;margin-bottom:1.5mm;">'+
'<div style="font-weight:800;font-size:6mm;letter-spacing:3mm;">TPN</div>'+
subtitle+
'</div>'+
'<table style="width:100%;border-collapse:collapse;">'+
lr('\u0627\u0633\u0645 \u0627\u0644\u0645\u0631\u064A\u0636','Patient Name',escH(p.n||'Patient '+p.id))+
lr('\u0627\u0644\u062D\u062C\u0645 \u0627\u0644\u0643\u0644\u064A','Total Volume',bagVols[i]+' ml')+
lr('\u0627\u0644\u062A\u0627\u0631\u064A\u062E','Date',S.date)+
lr('\u0648\u0642\u062A \u0627\u0644\u062A\u062D\u0636\u064A\u0631','Time of Prep.',timeStr)+
lr('\u0645\u0639\u062F\u0644 \u0636\u062E \u0627\u0644\u062C\u0644\u0648\u0643\u0648\u0632','GIR',f(r.agir,1)+' mg/kg/min')+
lr('\u0627\u0644\u062A\u0646\u0627\u0636\u062D','Osmolarity',Math.round(r.osm)+' mOsm/L')+
lr('\u0627\u0644\u0625\u0636\u0627\u0641\u0627\u062A','Additives',additives)+
lr('\u0637\u0631\u064A\u0642 \u0627\u0644\u0625\u0639\u0637\u0627\u0621','Route',routeAr+' / '+routeEn)+
lr('\u062A\u0639\u0644\u064A\u0645\u0627\u062A \u0627\u0644\u062A\u0633\u0631\u064A\u0628','Instructions',instr)+
'</table>'+
'</div>';

container.appendChild(page);
}
});

document.body.appendChild(container);

var overlay=document.createElement('div');
overlay.id='lbl-loading';
overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:9999;display:flex;align-items:center;justify-content:center;';
overlay.innerHTML='<div style="background:#fff;border-radius:10px;padding:20px 32px;font-size:14px;font-weight:600;color:#333;box-shadow:0 8px 30px rgba(0,0,0,0.18);display:flex;align-items:center;gap:10px;"><i class="fas fa-spinner fa-spin" style="color:var(--acc);font-size:18px;"></i> Generating labels...</div>';
document.body.appendChild(overlay);

html2pdf().set({
margin:0,
filename:'TPN-Labels-'+S.date+'.pdf',
image:{type:'jpeg',quality:0.98},
html2canvas:{scale:4,useCORS:true,backgroundColor:'#ffffff'},
jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
pagebreak:{mode:['css']}
}).from(container).save().then(function(){
document.body.removeChild(container);
var ol=document.getElementById('lbl-loading');if(ol)document.body.removeChild(ol);
}).catch(function(err){
document.body.removeChild(container);
var ol=document.getElementById('lbl-loading');if(ol)document.body.removeChild(ol);
alert('Error generating PDF: '+err.message);
});
}
